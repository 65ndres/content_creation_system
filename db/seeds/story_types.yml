# Snapshot of story types from the local development database (2026-11-26).
# Loaded by db/seeds.rb, which creates or updates each one by name.
# outro_video is matched by OutroVideo name; brand_assets ids are Leonardo uploads.
---
- name: Christian gospel (paper relief)
  story_prompt_text: |
    Read the story above.
    You're a christian story teller. Do not change any word of the story.
    Begin with one sentence of no more than 25 words that shares the teaching of the story. Open that sentence naturally, the way a narrator would say it out loud, with a phrase such as 'Today's teaching is that', 'The teaching from today's reading is that', or 'Today's verse teaches us that'. Never use a label such as 'Teaching:'.
    Then leave a blank line and write the story exactly as given, starting with its reference.

    Split the teaching and the story into short beats, in order. Break only after a period or existing strong punctuation such as !, ?, ; or :, never at a comma. Keep every word, spelling, capitalization, punctuation mark and word order of each beat exactly as written; never paraphrase, summarize, add or remove words.
    After each beat, on its own line, write a scene direction in square brackets that starts with "[SCENE:" and says who is on screen, what each of them is doing (pose, gesture, where they look), where they are, and how the camera moves. Leave one blank line between beats.

    Rules for scene directions:
    - The teaching's direction establishes the world of the cited book (first-century Galilee or Jerusalem for the Gospels, and so on); it is never a title card.
    - Call Jesus "Jesus" every time. In parables, the master, lord, king, bridegroom, landowner, shepherd or father figure is written as "the master (shown as Jesus)" or the matching role with "(shown as Jesus)".
    - Give every other person or group one short name the first time they appear (for example "John", "the first servant", "the disciples") and use exactly that name in every later direction.
    - Never show God as a person. Show divine presence through light, fire, cloud, wind, the temple or creation.
    - Show only people and events the beat mentions or clearly implies; do not invent subplots, events or characters.
    - Describe only actions, places and moods, not faces, ages, bodies or clothing; looks are added later.
    - Describe hard moments symbolically and calmly, without words such as blood, wound, injury, violence, trampling, crushing or fallen.
    - Never ask for text, letters or readable writing.

    Return only the teaching beat and the story beats, each followed by its scene direction, with nothing after the last direction.
  scenes_json_prompts: |-
    I have a Bible passage that may begin with a one-sentence teaching before the Scripture. Create image prompts for every scene without inventing events, characters, or plot.

    The text is split into beats. Each beat is followed by a scene direction in square brackets that starts with [SCENE:. The directions are not narration: never put them, or any part of them, in an 'original'. Leave them out when checking that the 'original' values reproduce the teaching and Scripture exactly. Build each image prompt from the direction that follows its beat, keeping who is on screen, what each person is doing, the place and the camera; when you combine beats into one 'original', merge their directions into one moment. Use the same character names as the directions.

    Return ONLY valid JSON. The root object must contain one key named 'pairs'. Each pair must contain 'original' and 'aiImagePrompts'. Each 'aiImagePrompts' value must be an array containing exactly one string.

    Important: valid JSON requires double quotes in the generated JSON, even though this instruction uses single quotes when referring to keys and phrases.

    If the text begins with a teaching, the first 'original' is that teaching and the second 'original' must be the spoken reference. Otherwise the first 'original' must be the spoken reference.

    For a range: '[Book] chapter [number], from verse [start] to [end]'

    For one verse: '[Book] chapter [number], verse [number]'

    Do not repeat the citation later.

    Every Scripture 'original' must match the source 100% exactly. Preserve every word, spelling, capitalization, punctuation mark, and word order. Never paraphrase, summarize, explain, add, remove, improve, or replace Scripture.

    Split scenes only after periods or existing strong punctuation such as !, ?, ;, or :. Never split scenes at commas.

    Do not add verse numbers, headings, labels, or citations. Combining all Scripture 'original' values in order must reproduce the supplied Scripture exactly, without the bracketed scene directions.

    Do not add any transition, introduction, or bridging pair of your own. The teaching already introduces itself.

    Copy the teaching exactly, before the reference. Preserve every word and punctuation mark. Give every teaching sentence at least one scene.

    PALETTE (the only colors allowed, use these exact names): Cerulean Blue, Lavender, Dusty Pink, Coral, Marigold Orange, Vermilion, Soft White, Deep Navy, Mustard Yellow. Cerulean Blue is #278dab, a medium cerulean teal blue. Marigold Orange is #ff941f, a bright warm marigold orange. Mustard Yellow is #d4a72c, a muted golden mustard. Never write hex codes in image prompts; write only the color names, and describe Cerulean Blue as 'Cerulean Blue (medium teal blue)', Marigold Orange as 'Marigold Orange (bright warm orange)', and Mustard Yellow as 'Mustard Yellow (muted golden mustard)' the first time each appears in a prompt. Roles: Cerulean Blue for daytime sky; Deep Navy for night sky, darkness, and deep shadow; Lavender for rocks, cliffs, stone, and shade; Dusty Pink for walls, clouds, and ground; Coral for warm backgrounds and fire; Marigold Orange only for the sun disc, small lamp flames, and small wooden objects, never for cast light, glows, lit paths, or highlights; Soft White for holy or radiant robes, and for all light, glows, and highlights; Vermilion for small accents only; Mustard Yellow for grain fields, baskets, pottery, rope, and clothing.

    Start every image prompt with 'Create a handcrafted layered paper relief artwork of...' Name a palette color for every major element of the setting, following the roles above (for example, 'Lavender cliffs under a Cerulean Blue sky with a large Marigold Orange sun disc'). End every image prompt with this exact style block, copied word for word: 'Style: handcrafted layered paper relief, sculpted cut-paper art. Every surface embossed with fine carved grooves: swirling concentric ridges in clouds and smoke, long parallel striations on hills, ground, water, and robes, tiny clustered scale textures on foliage and stone. Solid matte color on each paper layer, no gradients, no black outlines; depth comes only from soft shadows between stacked layers. Every person has a simple face: dot eyes, short brows, tiny nose, small calm mouth; no blank faces. Colors limited to cerulean blue, lavender, dusty pink, coral, marigold orange, mustard yellow, vermilion, soft white, and deep navy. No brown (except Jesus's hair and beard), beige, tan, gray, or green. Bold simple shapes. Vertical 9:16, full-bleed artwork filling the whole canvas with no border, frame, or margin. No text, no color swatches, no palette chart.'

    Illustrate the exact spoken beat through action, setting, gestures, light, paths, scrolls, storms, speakers, listeners, worship, or symbolic objects. Do not invent subplots, events, or characters.

    Keep every scene in the historical and literary world of the cited book. Psalms should show ancient Israelite worship. Wisdom books should show city gates, elders, households, workshops, or contrasting paths. Torah should show the ancient Near East, Egypt, wilderness, Sinai, or the tabernacle. Historical books should show palaces, city walls, prophets, battles, or exile. Prophets should show their named cities, ruins, restoration, or visions. Gospels should show first-century Galilee or Jerusalem. Acts and Epistles should show Roman roads, cities, prisons, house churches, or letters. Revelation should appear visionary and cosmic. Infer the proper setting for other books.

    The first image must establish the book's world and must not be a title card. Maintain continuity unless the source changes the setting.

    For every person shown, add a short outfit note of no more than 10 words: garment style plus one or two exact palette names (for example, 'Marigold Orange robe, Lavender sash'). Jesus always appears exactly the same: a long plain Soft White robe with a Dusty Pink mantle draped diagonally over one shoulder and across his chest, brown hair, and a brown beard. Every image prompt that shows Jesus must describe him with exactly this wording: 'Jesus with brown hair and a brown beard, wearing a long plain Soft White robe with a Dusty Pink mantle draped diagonally over one shoulder and across his chest'. Never change his clothing or colors, even if the passage mentions other garments. Never put Marigold Orange on Jesus: no Marigold Orange clothing, sash, light, or glow on or around him; any light on him is a Soft White glow. In parables, the master, lord, king, bridegroom, landowner, shepherd, or father figure is drawn exactly as Jesus, with the same exact wording, and is called 'the master (shown as Jesus)' or the matching role. No one else wears a Soft White robe or a Dusty Pink mantle over the shoulder. Give each other named character one outfit when they first appear, and repeat that exact wording in every later scene that shows them. Give groups a mix of Coral, Marigold Orange, Mustard Yellow, Lavender, Cerulean Blue, and Dusty Pink tunics. Every person, Jesus included, has a very simple face: two small dark dot eyes, short brow lines, a tiny nose, and a small calm mouth; never a blank or featureless face. Apart from Jesus's brown hair and brown beard and this simple face, do not describe anyone's face, age, hair, or body. Do not depict God as a human figure; parable figures drawn as Jesus are the only exception. Show divine presence through light, fire, cloud, wind, the temple, or creation.

    Include no readable text, captions, verse numbers, modern objects, or modern settings. Image safety filters react to sensitive words even when negated. When a passage mentions crushing, trampling, wounds, death, or violence, show it symbolically or as a calm moment, and never write words such as blood, wound, injury, violence, trampling, crushing, or fallen in an image prompt, not even as "no blood" or "unharmed". Show crowds as people standing with space between them, never pressed together.

    Each image prompt must be no longer than 1500 characters, including the style block.
